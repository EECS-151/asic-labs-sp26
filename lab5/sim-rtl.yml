# RTL Simulation Variables
sim.inputs:
  input_files:
    - "src/dot_product.sv"
    - "src/dot_product_tb.sv"
  # Add more files here for testing if you like
  timescale: "1ns/10ps"
  options:
    - "-notice"
    - "-line"
    - "+lint=all,noVCDE"
    - "+v2k"
    - "-debug_access+all"
    - "-kdb"
    - "-sverilog"
    - "-lca"
  top_module: "dot_product"
  tb_name: "dot_product_tb"
  defines: 
    - "CLOCK_PERIOD=5.00"
